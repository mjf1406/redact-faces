<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redact Faces</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('redact-faces-theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          // Paint the canvas before the CSS bundle. Matches --background in src/index.css.
          root.style.backgroundColor = dark ? 'oklch(0.153 0.006 107.1)' : 'oklch(1 0 0)';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
